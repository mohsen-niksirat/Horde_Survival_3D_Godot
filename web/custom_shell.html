<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>HordeSurvival 3D</title>
	<style>
		:root { --bg: #1a1c26; --accent: #6bb6ff; --gold: #ffd700; }
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: var(--bg);
			color: #e8eaf0;
			font-family: 'Segoe UI', system-ui, sans-serif;
			display: flex; align-items: center; justify-content: center;
			height: 100vh; overflow: hidden;
		}
		#frame { position: relative; width: 100vw; height: 100vh; }
		#canvas { width: 100%; height: 100%; display: block; outline: none; }
		#loader {
			position: absolute; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center; gap: 18px;
			background: var(--bg); z-index: 10;
		}
		#loader.hidden { display: none; }
		h1 { font-size: 2.4rem; letter-spacing: 2px; color: var(--gold); text-shadow: 0 0 24px rgba(255,215,0,.35); }
		#status { color: #9aa3b5; font-size: 1rem; }
		#bar-outer { width: min(420px, 70vw); height: 10px; border-radius: 6px; background: #2a2d3a; overflow: hidden; }
		#bar-inner { width: 0%; height: 100%; background: linear-gradient(90deg, var(--accent), #9bd0ff); transition: width .2s ease; }
		#click-to-play {
			display: none; margin-top: 10px; padding: 14px 44px;
			font-size: 1.2rem; letter-spacing: 1px;
			color: #10131c; background: var(--gold); border: 0; border-radius: 10px;
			cursor: pointer; font-weight: 700;
		}
		#click-to-play:hover { filter: brightness(1.1); }
		#error { color: #ff6b6b; max-width: 80vw; text-align: center; display: none; white-space: pre-wrap; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<div id="frame">
		<canvas id="canvas"></canvas>
		<div id="loader">
			<h1>HordeSurvival 3D</h1>
			<div id="bar-outer"><div id="bar-inner"></div></div>
			<div id="status">Loading assets...</div>
			<button id="click-to-play">PLAY</button>
			<div id="error"></div>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const loader = document.getElementById('loader');
		const bar = document.getElementById('bar-inner');
		const statusEl = document.getElementById('status');
		const playBtn = document.getElementById('click-to-play');
		const errorEl = document.getElementById('error');
		let engine = null;

		// Drop Pointer Lock whenever the tab/page is left or backgrounded.
		// Otherwise the browser keeps showing "press Esc to see your mouse".
		function forceUnlockPointer() {
			try {
				if (document.exitPointerLock) document.exitPointerLock();
			} catch (e) {}
		}
		window.__hordePointerRelease = forceUnlockPointer;
		document.addEventListener('visibilitychange', function () {
			if (document.hidden) forceUnlockPointer();
		});
		window.addEventListener('blur', forceUnlockPointer);
		window.addEventListener('pagehide', forceUnlockPointer);
		window.addEventListener('beforeunload', forceUnlockPointer);
		document.addEventListener('pointerlockchange', function () {
			if (document.hidden && document.pointerLockElement) forceUnlockPointer();
		});

		function webglSupported() {
			try {
				const c = document.createElement('canvas');
				return !!(window.WebGL2RenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
			} catch (e) { return false; }
		}

		if (!webglSupported()) {
			statusEl.textContent = 'Loading failed';
			errorEl.style.display = 'block';
			errorEl.textContent = 'WebGL is not available in this browser. Please use a modern browser with hardware acceleration enabled.';
			document.getElementById('bar-outer').style.display = 'none';
		} else {
			GODOT_CONFIG['onProgress'] = function (current, total) {
				const pct = total > 0 ? (current / total) * 100 : 0;
				bar.style.width = pct + '%';
				statusEl.textContent = 'Loading assets... ' + Math.round(pct) + '%';
			};
			engine = new Engine(GODOT_CONFIG);
			statusEl.textContent = 'Ready!';
			playBtn.style.display = 'block';
			playBtn.addEventListener('click', () => {
				playBtn.style.display = 'none';
				statusEl.textContent = 'Downloading game (first visit is slower)...';
				bar.style.width = '0%';
				forceUnlockPointer();
				engine.startGame().then(() => {
					loader.classList.add('hidden');
				}).catch(err => {
					errorEl.style.display = 'block';
					errorEl.textContent = 'Failed to start: ' + err;
					loader.classList.remove('hidden');
					playBtn.style.display = 'block';
					forceUnlockPointer();
				});
			});
		}
	</script>
</body>
</html>
