<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>HordeSurvival 3D</title>
	<style>
		:root {
			--bg: #10121a;
			--card: #181b26;
			--accent: #4da6ff;
			--accent-glow: rgba(77, 166, 255, 0.4);
			--gold: #ffd700;
			--gold-glow: rgba(255, 215, 0, 0.45);
			--text-dim: #8b95a8;
			--text-light: #e8eaf0;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			background: var(--bg);
			color: var(--text-light);
			font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
			display: flex; align-items: center; justify-content: center;
			height: 100vh; overflow: hidden;
			user-select: none;
		}
		#frame { position: relative; width: 100vw; height: 100vh; }
		#canvas { width: 100%; height: 100%; display: block; outline: none; }
		#loader {
			position: absolute; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center; gap: 20px;
			background: radial-gradient(circle at center, #181c2b 0%, #0d0f17 100%);
			z-index: 10;
			transition: opacity 0.3s ease, visibility 0.3s ease;
		}
		#loader.hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		h1 {
			font-size: 2.5rem;
			letter-spacing: 3px;
			color: var(--gold);
			text-shadow: 0 0 28px var(--gold-glow);
			font-weight: 800;
			text-transform: uppercase;
		}
		.subtitle {
			font-size: 0.95rem;
			color: var(--text-dim);
			margin-top: -10px;
			letter-spacing: 1px;
		}
		#status {
			color: #b0bad0;
			font-size: 0.95rem;
			font-weight: 500;
			min-height: 1.4em;
			text-align: center;
		}
		#bar-outer {
			width: min(440px, 78vw);
			height: 12px;
			border-radius: 8px;
			background: #1e2230;
			box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.2);
			overflow: hidden;
			padding: 2px;
		}
		#bar-inner {
			width: 0%;
			height: 100%;
			border-radius: 6px;
			background: linear-gradient(90deg, var(--accent) 0%, #70baff 50%, var(--gold) 100%);
			box-shadow: 0 0 12px var(--accent-glow);
			transition: width 0.15s ease-out;
		}
		#click-to-play {
			display: none;
			margin-top: 10px;
			padding: 14px 52px;
			font-size: 1.25rem;
			letter-spacing: 2px;
			color: #0c0e14;
			background: linear-gradient(180deg, #ffe033 0%, var(--gold) 100%);
			border: 0;
			border-radius: 12px;
			cursor: pointer;
			font-weight: 800;
			box-shadow: 0 4px 24px var(--gold-glow);
			transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
			animation: pulse-glow 2s infinite ease-in-out;
		}
		#click-to-play:hover {
			transform: scale(1.04);
			filter: brightness(1.1);
			box-shadow: 0 6px 30px rgba(255, 215, 0, 0.65);
		}
		#click-to-play:active {
			transform: scale(0.98);
		}
		@keyframes pulse-glow {
			0%, 100% { box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4); }
			50% { box-shadow: 0 4px 32px rgba(255, 215, 0, 0.75); }
		}
		#error {
			color: #ff6b6b;
			max-width: 85vw;
			text-align: center;
			display: none;
			white-space: pre-wrap;
			font-size: 0.95rem;
			background: rgba(255, 80, 80, 0.1);
			border: 1px solid rgba(255, 80, 80, 0.25);
			padding: 12px 20px;
			border-radius: 8px;
		}
		#retry-btn {
			display: none;
			margin-top: 8px;
			padding: 10px 28px;
			background: #2a3144;
			color: #fff;
			border: 1px solid #444f6d;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 600;
		}
		#retry-btn:hover { background: #353e56; }
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<div id="frame">
		<canvas id="canvas"></canvas>
		<div id="loader">
			<h1>HordeSurvival 3D</h1>
			<div class="subtitle">Stylized Roguelite Survival</div>
			<div id="bar-outer"><div id="bar-inner"></div></div>
			<div id="status">Connecting...</div>
			<button id="click-to-play">PLAY NOW</button>
			<div id="error"></div>
			<button id="retry-btn">Retry</button>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		// Register Service Worker for persistent caching of game assets across visits
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('sw.js', { scope: './' })
				.then(reg => reg.update().catch(() => {}))
				.catch(() => {});
		}

		const GODOT_CONFIG = $GODOT_CONFIG;
		const loader = document.getElementById('loader');
		const bar = document.getElementById('bar-inner');
		const statusEl = document.getElementById('status');
		const playBtn = document.getElementById('click-to-play');
		const errorEl = document.getElementById('error');
		const retryBtn = document.getElementById('retry-btn');
		let engine = null;
		let downloadComplete = false;

		function forceUnlockPointer() {
			try {
				if (document.exitPointerLock) document.exitPointerLock();
			} catch (e) {}
		}
		window.__hordePointerRelease = forceUnlockPointer;
		document.addEventListener('visibilitychange', function () {
			if (document.hidden) forceUnlockPointer();
		});
		window.addEventListener('blur', forceUnlockPointer);
		window.addEventListener('pagehide', forceUnlockPointer);
		window.addEventListener('beforeunload', forceUnlockPointer);
		document.addEventListener('pointerlockchange', function () {
			if (document.hidden && document.pointerLockElement) forceUnlockPointer();
		});

		function webglSupported() {
			try {
				const c = document.createElement('canvas');
				return !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
			} catch (e) { return false; }
		}

		if (!webglSupported()) {
			statusEl.textContent = 'WebGL 2 Required';
			errorEl.style.display = 'block';
			errorEl.textContent = 'WebGL 2 is not available in this browser. Please use a modern browser with hardware acceleration enabled.';
			document.getElementById('bar-outer').style.display = 'none';
		} else {
			// Real download telemetry tracking
			GODOT_CONFIG['onProgress'] = function (current, total) {
				if (downloadComplete) return;
				const pct = total > 0 ? Math.min(100, (current / total) * 100) : 0;
				bar.style.width = Math.max(3, pct) + '%';
				const mbLoaded = (current / (1024 * 1024)).toFixed(1);
				if (total > 0) {
					const mbTotal = (total / (1024 * 1024)).toFixed(1);
					statusEl.textContent = 'Loading game assets... ' + Math.round(pct) + '% (' + mbLoaded + ' / ' + mbTotal + ' MB)';
				} else {
					statusEl.textContent = 'Loading game assets... ' + mbLoaded + ' MB';
				}
			};

			engine = new Engine(GODOT_CONFIG);

			const exe = GODOT_CONFIG.executable || 'index';
			const pack = GODOT_CONFIG.mainPack || (exe + '.pck');
			if (!GODOT_CONFIG.args) GODOT_CONFIG.args = [];
			GODOT_CONFIG.args = ['--main-pack', pack].concat(GODOT_CONFIG.args);

			function startLoad() {
				errorEl.style.display = 'none';
				retryBtn.style.display = 'none';
				statusEl.textContent = 'Initializing engine...';
				bar.style.width = '3%';

				// Download & compile WASM and preload PCK immediately in parallel
				Promise.all([
					engine.init(exe),
					engine.preloadFile(pack, pack)
				]).then(() => {
					downloadComplete = true;
					bar.style.width = '100%';
					statusEl.textContent = 'Ready!';
					playBtn.style.display = 'inline-block';
				}).catch(err => {
					console.error('Asset load error:', err);
					downloadComplete = true;
					statusEl.textContent = 'Failed to load';
					errorEl.style.display = 'block';
					errorEl.textContent = 'Loading failed: ' + (err.message || err) + '\nPlease check your connection and retry.';
					retryBtn.style.display = 'inline-block';
				});
			}

			retryBtn.addEventListener('click', () => {
				startLoad();
			});

			playBtn.addEventListener('click', () => {
				playBtn.disabled = true;
				playBtn.style.opacity = '0.5';
				statusEl.textContent = 'Starting game...';
				forceUnlockPointer();

				// Resume AudioContext inside the user gesture
				try {
					const contexts = [window.AudioContext, window.webkitAudioContext].filter(Boolean);
					contexts.forEach(Ctx => { try { const c = new Ctx(); if (c.resume) c.resume(); } catch (e) {} });
				} catch (e) {}

				// Engine is already inited & preloaded, start() completes instantly
				engine.start().then(() => {
					loader.classList.add('hidden');
				}).catch(err => {
					console.error('Start error:', err);
					errorEl.style.display = 'block';
					errorEl.textContent = 'Failed to start game: ' + (err.message || err);
					playBtn.disabled = false;
					playBtn.style.opacity = '1';
				});
			});

			// Begin loading immediately on page load!
			startLoad();
		}
	</script>
</body>
</html>
