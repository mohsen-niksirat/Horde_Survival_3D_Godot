name: Deploy Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v2
        with:
          version: "4.7.2-stable"
          export-templates: true

      - name: Import assets (headless)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --import --quit 2>&1 | tee import.log
          if grep -Eq "^ERROR:|SCRIPT ERROR:" import.log; then
            echo "Asset import reported errors; refusing to deploy."
            exit 1
          fi

      - name: Run headless tests
        run: |
          python3 tools/run_tests.py --godot godot

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results
          path: build/test-results

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Deploy service worker
        run: |
          # Stamp the SW cache name with the commit SHA so each deploy
          # invalidates the engine cache — otherwise clients would keep
          # serving the previous build's wasm/pck forever.
          sed "s/hs3d-v4/hs3d-$GITHUB_SHA/" web/sw.js > build/web/sw.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Package the itch.io build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/itch
          cp -r build/web/. build/itch/
          # itch.io serves the build from an iframe wrapper; the exported
          # entry point has to be renamed so it does not shadow the wrapper.
          mv build/itch/index.html build/itch/game.html
          cp web/itch/itch.html build/itch/index.html
          # The service worker is stamped per deploy for GitHub Pages and is
          # not needed on itch.io.
          rm -f build/itch/sw.js
          (cd build/itch && zip -qr ../horde-survival-3d-itch.zip .)
          echo "itch.io package: build/horde-survival-3d-itch.zip"

      - name: Upload itch.io package
        uses: actions/upload-artifact@v4
        with:
          name: horde-survival-3d-itch
          path: build/horde-survival-3d-itch.zip
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
