name: Deploy Web Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: lihop/setup-godot@v2
        with:
          version: "4.7.2-stable"
          export-templates: true

      - name: Import assets (headless)
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --import --quit 2>&1 | tee import.log
          if grep -Eq "^ERROR:|SCRIPT ERROR:" import.log; then
            echo "Asset import reported errors; refusing to deploy."
            exit 1
          fi

      - name: Run headless tests
        run: |
          python3 tools/run_tests.py --godot godot

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results
          path: build/test-results

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Deploy shell page
        run: |
          cp web/index.html build/web/index_shell.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
