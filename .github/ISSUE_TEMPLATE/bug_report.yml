name: Bug report
description: Something in the game is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use the in-game **SEND FEEDBACK** button (Settings menu) for
        general feedback — it opens this form in your browser.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken and how do you trigger it?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Web / Android / Windows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Browser console output or the Godot error log, if any.
      render: shell
    validations:
      required: false
